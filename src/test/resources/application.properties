spring.datasource.url=jdbc:h2:mem:manka-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=test-secret-key-with-at-least-thirty-two-bytes
security.jwt.access-expiration-seconds=900
security.jwt.refresh-expiration-seconds=604800
security.cors.allowed-origins=http://localhost:3000
mail.enabled=false
spring.mail.host=localhost
management.health.mail.enabled=false
