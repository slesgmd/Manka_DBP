spring.application.name=manka-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

security.jwt.secret=${JWT_SECRET}
security.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-reply@manka.local}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=${MAIL_ENABLED:false}

manka.recommendation.weights.coverage=${RECOMMENDATION_WEIGHT_COVERAGE:0.35}
manka.recommendation.weights.time=${RECOMMENDATION_WEIGHT_TIME:0.20}
manka.recommendation.weights.variety=${RECOMMENDATION_WEIGHT_VARIETY:0.10}
manka.recommendation.weights.repetition=${RECOMMENDATION_WEIGHT_REPETITION:0.20}
manka.recommendation.weights.popularity=${RECOMMENDATION_WEIGHT_POPULARITY:0.15}
manka.seed.enabled=${MANKA_SEED_ENABLED:true}
