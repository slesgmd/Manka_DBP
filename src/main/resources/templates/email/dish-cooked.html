<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cooking history updated</title>
</head>
<body>
<h1>Cooking history updated</h1>
<p>Hello <span th:text="${name}">user</span>.</p>
<p><strong th:text="${dishName}">Dish</strong> was added to your history.</p>
<p>Cooked at: <span th:text="${cookedAt}">date</span>.</p>
</body>
</html>
